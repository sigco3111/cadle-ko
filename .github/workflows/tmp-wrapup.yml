name: tmp wrapup
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wrapup:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install
        run: npm install --no-audit --no-fund
      - name: format overlay
        run: npx --yes prettier@3 --write src/i18n/overlay.js
      - name: build
        run: npx vite build --base=/cadle-ko/
      - name: publish docs
        run: node tools/wrapup/publish.mjs
      - name: playwright
        run: npx playwright install --with-deps chromium
      - name: screenshots
        run: node tools/wrapup/screenshots.mjs
      - name: status
        run: git status --porcelain | head -40
      - name: commit
        run: |
          git config user.name "sigco3111"
          git config user.email "sigco3111@users.noreply.github.com"
          git add -A docs src/i18n/overlay.js
          git commit -m "게임: 게임 내 크레딧 패널·재빌드 반영, README용 스크린샷 추가" || echo "no changes"
          git push
